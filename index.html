  const cw=4,chh=8,cols=Math.floor(w/cw),rows=Math.floor(h/chh);x.font=`700 ${chh*.95}px "Courier New",ui-monospace,monospace`;x.textAlign="center";x.textBaseline="middle";
  const P=(c,r,ch,col,al=1)=>{if(c<0||c>=cols||r<0||r>=rows)return;x.globalAlpha=al;x.fillStyle=col;x.fillText(ch,(c+.5)*cw,(r+.5)*chh)};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=r/rows;if(rnd()<.06+.3*t*t)P(c,r,".:'`,;"[Math.floor(rnd()*6)],"#4a4338",.28+.3*t)}
  const cx=cols/2,hw=Math.min(cols/2-2,Math.round(hwPx/cw)),sp=Math.round(rows*.42),dy=(sp-2)*2,R=(dy*dy+hw*hw)/(2*hw),arch=[];
  for(let r=2;r<rows;r++){let xl;if(r<sp){const d=(sp-r)*2,q=R*R-d*d;if(q<0)continue;xl=cx+(R-hw)-Math.sqrt(q)}else xl=cx-hw;
    for(let t=0;t<4;t++){const ch=t<1?"#":t<3?"%":"=",col=t<3?"#2c2620":"#6f6658";P(Math.round(xl)+t-1,r,ch,col);P(Math.round(2*cx-xl)-t,r,ch,col)}arch.push([xl,r])}
  for(const [xl,r] of arch)if(rnd()<.55)for(const s of[1,-1]){const c=Math.round(s>0?xl:2*cx-xl)+s*(2+Math.floor(rnd()*4));P(c,r,"@&%8*"[Math.floor(rnd()*5)],rnd()<.5?"#2f5a33":"#4b7a42",.95)}
  const mr=Math.max(3,Math.round(rows*.07)),my=Math.round(rows*.09)+mr;
  for(let r=-mr-2;r<=mr+2;r++)for(let c=-mr*2-4;c<=mr*2+4;c++){const d=Math.hypot(c/2,r);if(d<=mr)P(Math.round(cx)+c,my+r,d<mr*.6?"O":"o","#f6e8b0",1);else if(d<mr+2.2)P(Math.round(cx)+c,my+r,".","#fff6d0",.6)}
  for(let i=0;i<30;i++)P(Math.floor(rnd()*cols),Math.floor(rnd()*rows*.35),rnd()<.5?"*":"+","#e0c25a",.9);
  const fy=rows-Math.round(rows*.1);
  for(let c=1;c<cols;c+=3){for(let r=fy;r<rows;r++)P(c,r,"|","#1b1713");P(c,fy-1,"^","#1b1713")}
  for(let r=fy+1;r<=fy+2;r++)for(let c=0;c<cols;c++)P(c,r,"=","#1b1713");
  for(let c=0;c<cols;c++)for(let r=fy+3;r<rows;r++)if(rnd()<.55)P(c,r,"\"|,'/\\"[Math.floor(rnd()*6)],rnd()<.5?"#2b5330":"#456f3d");
  x.globalAlpha=1}

/* ================= 3. Roses: bud -> red bloom -> wither -> falls -> black bud -> black rose forever ================= */
const C=[[185,265,80],[240,172,45],[298,258,40],[72,372,55],[232,372,55],[310,445,60],[155,412,35]],
      YT=140,YB=725;
const RCX=C.map(q=>(q[0]-34)/2),RCY=C.map(q=>(q[1]-128)/4),RR=C.map(q=>q[2]/2);
const TB=[0,1,.92,.8,.62,.42,.05],VB=[0,86,74,60,42,24,4];
const RP=[" ",".",":","+","*","#","@"];
const RF=C.map(q=>.72*cl((YB-q[1])/(YB-YT))),HF=C.map(q=>cl((YB-q[1])/(YB-YT)));

/* timeline (seconds) */
const T_RED=4.2,D_GROW=3.2,BUD=.42,D_BLK=2.6,
      T_DRY=10.8,DRY_D=2.4,T_FALL=13.2,FALL_D=1.5,T_BLK=16.4;
/* each withered head falls as a whole */
const TF=C.map((q,k)=>T_FALL+(1-HF[k])*1.0),
      FSPIN=C.map((q,k)=>(k%2?1:-1)*(.55+.16*k)),
      FDR=C.map((q,k)=>((k*37)%5-2)*.3);
/* the black plant is reborn from the ground, bud by bud */
const FB=C.map((q,k)=>T_BLK+HF[k]*3.4+.55);

/* fast trig + easing */
const TAU=Math.PI*2,SINN=2048,SINT=new Float32Array(SINN);
for(let i=0;i<SINN;i++)SINT[i]=Math.sin(i/SINN*TAU);
const fsin=a=>SINT[(a*SINN/TAU|0)&(SINN-1)];
const smooth=p=>p*p*(3-2*p);
const easeOut=p=>1-Math.pow(1-p,3);
/* small closed bud, then the flower opens */
const budScale=p=>{if(p<=0)return 0;
  if(p<BUD){const q=p/BUD;return .22+.36*smooth(q)}
  const q=(p-BUD)/(1-BUD);return .58+.42*easeOut(q)};

/* ---- build the cell model once ---- */
const _gx=[],_gy=[],_d=[],_k=[],_rel=[],_h=[],_rnd=[];
const rc=rng(0x5eed);
for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
  const d=+GRID[gy][gx];if(!d)continue;
  const px=34+2*gx,py=128+4*gy;
  let rel=9,k=-1;
  for(let j=0;j<C.length;j++){const dx=gx-RCX[j],dy=gy-RCY[j],r=Math.hypot(dx,2*dy)/RR[j];if(r<rel){rel=r;k=j}}
  const rose=rel<1;
  _gx.push(gx);_gy.push(gy);_d.push(d);_k.push(rose?k:-1);_rel.push(rel);
  _h.push(cl((YB-py)/(YB-YT)));_rnd.push(rc());
}
const N=_gx.length;
const GX=Uint8Array.from(_gx),GY=Uint8Array.from(_gy),DL=Uint8Array.from(_d);
const DL2=Uint8Array.from(_d,function(v){return Math.min(6,v+1)});
const KK=Int8Array.from(_k),REL=Float32Array.from(_rel),HH=Float32Array.from(_h),RND=Float32Array.from(_rnd);
const LEV=Float32Array.from(_d,function(v){return (v-1)/5});
const ORD=Array.from({length:N},(_,i)=>i);
const SW1=new Float32Array(N),SW2=new Float32Array(N);
for(let i=0;i<N;i++){SW1[i]=Math.pow(HH[i],2.5)*.9;SW2[i]=HH[i]*HH[i]*.3}

/* ---- renderer: typed-array pixel buffer (fast, no per-cell canvas calls) ---- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),cache={};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let cw=1,chh=2,W=1,H=1,img=null,u32=null,colW=null,rowH=null;
const MA=new Array(N),MB=new Array(N),maskCache=new Map();
function glyphMask(ch,w,h){
  const key=ch+":"+w+":"+h;let m=maskCache.get(key);if(m)return m;
  const c=document.createElement("canvas");c.width=Math.max(1,w);c.height=Math.max(1,h);
  const g=c.getContext("2d");g.font=`700 ${Math.max(1,h*.98)}px "Courier New",ui-monospace,Menlo,Consolas,monospace`;
  g.textAlign="center";g.textBaseline="middle";g.fillStyle="#fff";g.fillText(ch,w/2,h/2+.5);
  const id=g.getImageData(0,0,c.width,c.height).data;m=new Uint8Array(w*h);
  for(let i=0;i<m.length;i++)m[i]=id[i*4+3];
  maskCache.set(key,m);return m;
}
function buildMasks(){for(let i=0;i<N;i++){const w=colW[GX[i]],h=rowH[GY[i]];MA[i]=glyphMask(RP[DL[i]],w,h);MB[i]=glyphMask(RP[DL2[i]],w,h)}}
function size(){const wrap=document.getElementById("wrap"),dpr=Math.min(devicePixelRatio||1,1.5);
  const pw=Math.min(document.body.clientWidth-26,1000),ar=2*GH/GW;
  const rh=Math.min(pw*.86*ar,innerHeight*.86),rw=rh/ar,ph=Math.round(rh*1.2);
  wrap.style.width=pw+"px";wrap.style.height=ph+"px";
  cv.style.width=rw+"px";cv.style.height=rh+"px";cv.width=Math.round(rw*dpr);cv.height=Math.round(rh*dpr);
  cw=cv.width/GW;chh=cv.height/GH;W=cv.width;H=cv.height;
  const cx=new Int32Array(GW+1),ry=new Int32Array(GH+1);
  for(let i=0;i<=GW;i++)cx[i]=Math.round(i*cw);
  for(let i=0;i<=GH;i++)ry[i]=Math.round(i*chh);
  colW=new Uint8Array(GW);rowH=new Uint8Array(GH);
  for(let i=0;i<GW;i++)colW[i]=Math.max(1,cx[i+1]-cx[i]);
  for(let i=0;i<GH;i++)rowH[i]=Math.max(1,ry[i+1]-ry[i]);
  img=ctx.createImageData(W,H);u32=new Uint32Array(img.data.buffer);
  buildMasks();garden(pw,ph,dpr,Math.min(pw*.49,rw*.66));
}
/* one ASCII cell: flat block + character, exactly like the original look */
function blit(i,ox,oy,r0,g0,b0,fr,fg,fb,a,alt){
  const gx=GX[i],gy=GY[i],w=colW[gx],h=rowH[gy];
  const x0=Math.round((gx+ox)*cw),y0=Math.round((gy+oy)*chh);
  if(y0>=H||y0+h<=0||x0>=W||x0+w<=0)return;
  const m=alt?MB[i]:MA[i];
  /* +1px overlap keeps the ASCII cells seamless while the stem sways */
  for(let yy=0;yy<=h;yy++){
    const py=y0+yy;
    if(py<0||py>=H)continue;
    const inRow=yy<h;
    let o=py*W+x0;
    for(let xx=0;xx<=w;xx++,o++){
      const xs=x0+xx;
      if(xs<0||xs>=W)continue;
      const v=(inRow&&xx<w)?m[yy*w+xx]:0;let cr,cg,cb;
      if(v===0){cr=r0;cg=g0;cb=b0}
      else if(v===255){cr=fr;cg=fg;cb=fb}
      else{const t=v*(1/255);cr=(r0+(fr-r0)*t)|0;cg=(g0+(fg-g0)*t)|0;cb=(b0+(fb-b0)*t)|0}
      u32[o]=(a<<24)|(cb<<16)|(cg<<8)|cr;
    }
  }
}
/* per-frame scratch (no allocations in the hot loop) */
const SR=new Float32Array(7),SB=new Float32Array(7),FC=new Float32Array(7),FS=new Float32Array(7);
function frame(T,still){
  u32.fill(0);
  for(let k=0;k<7;k++){
    SR[k]=budScale(cl((T-(T_RED+RF[k]*3.0))/D_GROW));
    SB[k]=budScale(cl((T-FB[k])/D_BLK));
    const fu=T-TF[k];
    if(fu>0&&fu<=FALL_D){const th=fu*FSPIN[k];FC[k]=Math.cos(th);FS[k]=Math.sin(th)}else{FC[k]=1;FS[k]=0}
  }
  const dry=cl((T-T_DRY)/DRY_D);
  for(let oi=0;oi<N;oi++){
    const i=ORD[oi],k=KK[i],d=DL[i],hh=HH[i],rel=REL[i],k5=LEV[i];
    let a=255,ox=0,oy=0,r0,g0,b0,fr,fg,fb,alt=false;
    const sw=still?0:fsin(T*1.1+GY[i]*.12)*SW1[i]+fsin(T*.43+GX[i]*.05)*SW2[i];
    if(k>=0){
      const stB=FB[k];
      if(T<stB){
        /* red: bud -> flower -> dry -> fall */
        const s=SR[k];if(s<=0)continue;
        a=(cl((s*1.06-rel)*10)*255)|0;if(a<=2)continue;
        ox=(RCX[k]-GX[i])*(1-s);
        oy=(RCY[k]-GY[i]+RR[k]*.5)*(1-s);
        const fu=T-TF[k];
        if(fu>0){
          if(fu>FALL_D)continue;
          const dx=GX[i]-RCX[k],dy=GY[i]-RCY[k];
          ox+=dx*(FC[k]-1)-2*dy*FS[k];
          oy+=dx*.5*FS[k]+dy*(FC[k]-1);
          ox+=FDR[k]*fu*fu;
          oy+=26*fu*fu+1.2*fu;
          /* the head dissolves as it drops, so it never pops out */
          const fd=cl((fu/FALL_D-.55)/.45);a=(a*(1-fd*fd))|0;if(a<=2)continue;
        }
        oy+=dry*hh*1.2;
        const tb=TB[d];
        let br=40+195*tb,bg=26*tb,bb=40*tb,gr=180+65*tb,gg=30+105*tb,gb=38+100*tb;
        if(dry>0){
          br+=(112-46*k5-br)*dry;bg+=(82-40*k5-bg)*dry;bb+=(58-28*k5-bb)*dry;
          gr+=(172-52*k5-gr)*dry;gg+=(134-44*k5-gg)*dry;gb+=(92-30*k5-gb)*dry;
        }
        r0=br|0;g0=bg|0;b0=bb|0;fr=gr|0;fg=gg|0;fb=gb|0;alt=true;
      }else{
        /* black: bud -> black rose, alive forever */
        const s=SB[k];if(s<=0)continue;
        a=(cl((s*1.06-rel)*10)*255)|0;if(a<=2)continue;
        ox=(RCX[k]-GX[i])*(1-s);
        oy=(RCY[k]-GY[i]+RR[k]*.5)*(1-s);
        const v=VB[d];
        let gr=v+64,gg=v+64,gb=v+70;
        if(!still){const tw=Math.pow(Math.max(0,fsin(GX[i]*.12-GY[i]*.06-T*1.2)),10)*55;gr+=tw;gg+=tw;gb+=tw}
        r0=v;g0=v;b0=v+2;fr=gr|0;fg=gg|0;fb=gb|0;alt=true;
      }
    }else{
      /* stem & leaves: first life grows, dries and fades; then a dark one regrows */
      const lt=.72*hh+RND[i]*.03;
      if(T>=T_BLK){
        /* second life: regrow from the ground in dark green */
        const pr=cl((T-(T_BLK+lt*3.4))/.9);
        if(pr<=0)continue;
        a=(pr*255)|0;
        ox=(83-GX[i])*(1-pr)*.32;
        oy=(1-pr)*1.4;
        r0=24;g0=62;b0=36;fr=90;fg=156;fb=100;
      }else{
        const lp=cl((T-(.2+lt*3.6))/.85);
        if(lp<=0)continue;
        const va=cl((T-15.15)/.95);
        a=(lp*(1-va)*255)|0;if(a<=2)continue;
        ox=(83-GX[i])*(1-lp)*.32;
        oy=(1-lp)*1.4+dry*hh*1.4+va*va*5;
        let br=45-20*k5,bg=120-60*k5,bb=60-30*k5,gr=150-60*k5,gg=230-70*k5,gb=150-60*k5;
        if(dry>0){
          br+=(112-40*k5-br)*dry;bg+=(86-32*k5-bg)*dry;bb+=(54-22*k5-bb)*dry;
          gr+=(176-44*k5-gr)*dry;gg+=(140-38*k5-gg)*dry;gb+=(96-26*k5-gb)*dry;
        }
        r0=br|0;g0=bg|0;b0=bb|0;fr=gr|0;fg=gg|0;fb=gb|0;
      }
    }
    blit(i,ox+sw,oy,r0,g0,b0,fr,fg,fb,a,alt);
  }
  ctx.putImageData(img,0,0);
}
let t0=performance.now(),last=0;
function loop(now){
  requestAnimationFrame(loop);
  last=now;
  frame((now-t0)/1000,false);
}
document.getElementById("re").onclick=()=>{t0=performance.now();last=0;if(reduce)frame(30,true)};
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{drawText();size();if(reduce)frame(30,true)},200)});
drawText();size();
if(reduce)frame(30,true);else requestAnimationFrame(loop);

</script>
